<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Forum</title>
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/feed.css">
  <link rel="stylesheet" href="/assets/css/create-post.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="stylesheet" href="/assets/css/comments.css">
  <link rel="stylesheet" href="/assets/css/chat.css">
  <link rel="stylesheet" href="/assets/css/errorPage.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
</head>

<body>
  <div id="purple-glow"></div>
  <div class="menu-bg" id="sidebarOverlay"></div>

  <aside class="left-menu">
    <div class="logo clickable-logo" onclick="navigateTo('/')">💬 01-Forum</div>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>

    <div class="menu-title">Main menu</div>
    <ul class="links">
      <li class="active messages-link" onclick="toggleChatSidebar()">💬 Messages<span class="notification-count">0</span></li>
    </ul>

    <div class="menu-title">Quick actions</div>
    <button class="new-post-btn" onclick="navigateTo('/create-post')">✍️ Create Post</button>

    <div class="sidebar-categories">
      <button class="menu-btn active" data-cat="all" onclick="filterByCategory('all')">📋 All Posts</button>
      <button class="menu-btn" data-cat="liked" onclick="filterByCategory('liked')">👍 Liked Posts</button>
      <button class="menu-btn" data-cat="General" onclick="filterByCategory('General')">📝 General</button>
      <button class="menu-btn" data-cat="Technology" onclick="filterByCategory('Technology')">💻 Technology</button>
      <button class="menu-btn" data-cat="Programming" onclick="filterByCategory('Programming')">⌨️ Programming</button>
      <button class="menu-btn" data-cat="Gaming" onclick="filterByCategory('Gaming')">🎮 Gaming</button>
      <button class="menu-btn" data-cat="Science" onclick="filterByCategory('Science')">🔬 Science</button>
      <button class="menu-btn" data-cat="Education" onclick="filterByCategory('Education')">📚 Education</button>
    </div>

    <div class="sidebar-sidebar" id="sidebarsidebar"></div>
  </aside>

  <div class="main-content">
    <header class="top-bar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">&#9776;</button>
      <div class="auth-buttons" id="navAuthArea"></div>
    </header>

    <div class="page-with-chat" id="contentLayout">
      <main id="app" class="left-side"></main>
      <aside class="right-sidebar" id="chatSidebar">
        <div id="chat-view-users" class="chat-view">
          <div class="chat-top">
            <h4>Members</h4>
            <button class="close-chat" onclick="toggleChatSidebar()">&times;</button>
          </div>
          <div id="users-list" class="users-list"></div>
        </div>

        <div id="chat-view-conversation" class="chat-view hidden">
          <div class="chat-top">
            <button class="back-chat" onclick="switchChatView('users')">&larr;</button>
            <h4 id="active-chat-username">Chat</h4>
            <button class="close-chat" onclick="toggleChatSidebar()">&times;</button>
          </div>
          <input type="hidden" id="sidebar-receiver-id">
          <div id="messages" class="messages"></div>
          <form id="chat-input-box" class="chat-input-box">
            <input id="sidebar-chat-input" type="text" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
          </form>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
