<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Forum</title>
   <link rel="stylesheet" href="/assets/css/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M26 6H6C4.89543 6 4 6.89543 4 8V20C4 21.1046 4.89543 22 6 22H11L9.5 25.5C9.22386 26.1213 9.77614 26.5 10.5 26.5C11.2239 26.5 14.5 22 14.5 22H26C27.1046 22 28 21.1046 28 20V8C28 6.89543 27.1046 6 26 6Z" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Forum</span>
        </div>
        <button class="sidebar-close" id="sidebarClose"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        
        <!-- Navigation -->
        <ul class="nav-list">
            <li class="active" onclick="navigateTo('/')">Dashboard</li>
        </ul>

        <button class="btn-create" onclick="navigateTo('/create-post')">+ Create Post</button>
        
        <!-- Categories-->
        <div class="sidebar-categories" id="sidebarCategories"></div>

        <div class="sidebar-footer">
            <button class="btn-logout-sidebar" onclick="navigateTo('/login')">Login</button>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="main">
        <!-- TOP NAVBAR -->
        <header class="navbar">
            <div class="nav-left">
                <button class="menu-toggle" id="menuToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
            </div>
            <div class="navbar-right">
                <div class="auth-buttons">
                    <button class="btn-login" onclick="navigateTo('/login')">Login</button>
                    <button class="btn-register" onclick="navigateTo('/register')">Register</button>
                </div>
            </div>
        </header>

        <!-- DYNAMIC CONTENT  -->
        <main id="feed-container"></main>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
