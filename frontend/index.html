<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Forum</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo" onclick="navigateTo('/')" style="cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none;">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M26 6H6C4.89543 6 4 6.89543 4 8V20C4 21.1046 4.89543 22 6 22H11L9.5 25.5C9.22386 26.1213 9.77614 26.5 10.5 26.5C11.2239 26.5 14.5 22 14.5 22H26C27.1046 22 28 21.1046 28 20V8C28 6.89543 27.1046 6 26 6Z"
                    stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span style="font-size: 1.35rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Forum</span>
        </div>
        <button class="sidebar-close" id="sidebarClose"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg></button>

        <!-- MAIN MENU -->
        <div class="sidebar-section-label">MAIN MENU</div>
        <ul class="nav-list">
            <li class="active" onclick="filterByCategory('all')">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Dashboard
            </li>
        </ul>

        <!-- QUICK ACTIONS -->
        <div class="sidebar-section-label">QUICK ACTIONS</div>
        <button class="btn-create" onclick="navigateTo('/create-post')">+ Create Post</button>

        <!-- Categories -->
        <div class="sidebar-categories" id="sidebarCategories">
            <button class="cat-btn" onclick="filterByCategory('all')">
                <span class="cat-icon" style="background: #eef2ff; color: #6366f1;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </span>
                All Posts
            </button>
            <button class="cat-btn" onclick="filterByCategory('General')">
                <span class="cat-icon" style="background: #fce7f3; color: #ec4899;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </span>
                General
            </button>
            <button class="cat-btn" onclick="filterByCategory('Technology')">
                <span class="cat-icon" style="background: #e0f2fe; color: #0ea5e9;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                </span>
                Technology
            </button>
            <button class="cat-btn" onclick="filterByCategory('Programming')">
                <span class="cat-icon" style="background: #ede9fe; color: #8b5cf6;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </span>
                Programming
            </button>
            <button class="cat-btn" onclick="filterByCategory('Gaming')">
                <span class="cat-icon" style="background: #dcfce7; color: #22c55e;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg>
                </span>
                Gaming
            </button>
            <button class="cat-btn" onclick="filterByCategory('Science')">
                <span class="cat-icon" style="background: #f3e8ff; color: #a855f7;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 3h6v11a3 3 0 1 1-6 0V3z"/><path d="M6 14a6 6 0 0 0 12 0"/><line x1="12" y1="21" x2="12" y2="21"/></svg>
                </span>
                Science
            </button>
            <button class="cat-btn" onclick="filterByCategory('Education')">
                <span class="cat-icon" style="background: #ffedd5; color: #f97316;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </span>
                Education
            </button>
        </div>

        <div class="sidebar-footer" id="sidebarFooter">
            <button class="btn-logout-sidebar" id="sidebarLogoutBtn">Log Out</button>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="main">
        <!-- TOP NAVBAR -->
        <header class="navbar">
            <div class="nav-left">
                <button class="menu-toggle" id="menuToggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg></button>
            </div>
            <div class="navbar-right">
                <div class="auth-buttons" id="navAuthArea">
                    <!-- Dynamic user badge & global logout -->
                </div>
            </div>
        </header>

        <!-- DYNAMIC CONTENT  -->
        <main id="feed-container"></main>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/app.js"></script>
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('active'); });
        sidebarClose.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); });
    </script>
</body>

</html>
